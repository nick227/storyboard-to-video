<header class="sf-topbar">
  <div class="sf-topbar-inner">
    <a class="sf-brand" href="/library" aria-label="Storyboarder home">
      <span class="sf-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <path d="M9 4v16M3 10h6M3 15h6"></path>
        </svg></span>
      <span>Storyboarder</span>
    </a>
    <div class="sf-studio-global" aria-label="Script controls">
      <div class="storyboard-combo">
        <input id="storyboardTitle" class="storyboard-title" type="text" maxlength="200" aria-label="Script title"
          autocomplete="off" />
        <button id="storyboardPickerToggle" class="storyboard-picker-toggle" type="button" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="storyboardPickerList" aria-label="Change script" title="Change script">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 9 5 5 5-5" />
          </svg>
        </button>
        <ul id="storyboardPickerList" class="storyboard-picker-list" role="listbox" aria-label="Saved scripts" hidden>
        </ul>
      </div>
      <button id="newStoryboardBtn" class="sf-studio-icon-button" type="button" aria-label="New script"
        title="New script">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
      </button>
      <div class="script-menu-control">
        <button id="scriptMenuToggle" class="sf-studio-icon-button" type="button" aria-label="Script menu"
          title="Script menu" aria-haspopup="menu" aria-expanded="false" aria-controls="scriptMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h9l4 4v14H6zM15 3v5h5M9 12h6M9 16h6" />
          </svg>
        </button>
        <div id="scriptMenu" class="script-menu" role="menu" aria-label="Script menu" hidden>
          <span class="script-menu-label">Script</span>
          <button type="button" id="scriptMetaBtn" role="menuitem">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v6M12 7h.01" />
            </svg>
            <span><strong>Script details</strong></span>
          </button>
          <span class="script-menu-label">Actions</span>
          <button type="button" id="workShareBtn" role="menuitem" disabled>
            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="2.5" />
              <circle cx="6" cy="12" r="2.5" />
              <circle cx="18" cy="19" r="2.5" />
              <path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5" />
            </svg>
            <span><strong>Share</strong></span>
          </button>
          <button type="button" id="scriptImportBtn" role="menuitem">
            <svg viewBox="0 0 24 24">
              <path d="M12 21V9M7 14l5-5 5 5M4 4h16" />
            </svg>
            <span><strong>Import script</strong></span>
          </button>
          <input id="scriptImportInput" type="file" accept=".fountain,.txt,text/plain" hidden />
          <a id="downloadZipBtn" class="script-menu-secondary" href="#" role="menuitem">Download project package</a>
          <span class="script-menu-label">Settings</span>
          <button type="button" id="scriptPropertiesBtn" role="menuitem">
            <svg viewBox="0 0 24 24">
              <path d="m4 16 10-10 4 4L8 20H4zM12 8l4 4" />
            </svg>
            <span><strong>Script properties</strong></span>
          </button>
          <button type="button" id="scriptHelpBtn" class="script-menu-secondary" role="menuitem">Keyboard
            shortcuts</button>
          <button type="button" id="scriptDeleteBtn" class="script-menu-danger" role="menuitem">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6" />
            </svg>
            <span><strong>Delete script</strong></span>
          </button>
        </div>
      </div>
      <label class="sf-public-switch" title="Make Screenplay, Storyboard, and Timeline publicly viewable">
        <input type="checkbox" id="workVisibilityToggle" />
        <span class="sf-public-switch-track" aria-hidden="true"></span>
        <span class="sf-public-switch-label">Public</span>
      </label>
      <nav class="sf-artifact-tabs page-tabs" aria-label="Work artifacts">
        <a id="tabScriptBtn" class="sf-artifact-tab page-tab" data-artifact="screenplay" data-page="script"
          data-panel="scriptPagePanel" href="#">Screenplay</a>
        <a id="tabStoryboardBtn" class="sf-artifact-tab page-tab" data-artifact="storyboard" data-page="storyboard"
          data-panel="storyboardPagePanel" href="#">Storyboard</a>
        <a id="tabTimelineBtn" class="sf-artifact-tab page-tab" data-artifact="timeline" data-page="timeline"
          data-panel="timelinePagePanel" href="#">Timeline</a>
      </nav>
      <button id="saveStateBtn" class="hidden" disabled>Saved</button>
    </div>
    <nav class="sf-nav" aria-label="Primary navigation">
      <a class="sf-nav-link" href="/library" data-nav="library">Library</a>
      <a id="adminConsoleLink" class="sf-nav-link sf-admin-link" href="/admin" hidden>Admin</a>
    </nav>
    <div id="authLoggedOut" class="sf-account" hidden>
      <a class="sf-auth-link" href="/login.html?redirect=%2Flibrary">Sign in</a>
      <a class="sf-auth-link primary" href="/login.html?mode=register&amp;redirect=%2Flibrary">Create account</a>
    </div>
    <div id="authLoggedIn" class="sf-account" hidden>
      <a id="topbarCredits" class="sf-credits" href="/credits" title="Available credits" hidden>
        <span class="sf-credits-label">Credits</span>
        <strong id="topbarCreditsValue">—</strong>
      </a>
      <div class="sf-user" title="Signed-in account">
        <span id="authUserAvatar" class="sf-avatar" aria-hidden="true"></span>
        <span id="authUserLabel" class="sf-user-label"></span>
      </div>
    </div>
  </div>
</header>
