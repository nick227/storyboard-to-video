<dialog id="addSceneDialog" class="confirm-modal add-scene-dialog" aria-labelledby="addSceneDialogTitle">
  <h2 id="addSceneDialogTitle">Add scene</h2>
  <p>Create an empty numbered scene. Script source, narration, visual planning, and media can all be filled later.</p>
  <label class="entity-modal-field">
    <span>Placement</span>
    <select id="addScenePosition"></select>
  </label>
  <div class="confirm-modal-actions">
    <button type="button" id="addSceneCancel" class="secondary">Cancel</button>
    <button type="button" id="addSceneConfirm" class="primary">Add empty scene</button>
  </div>
</dialog>
