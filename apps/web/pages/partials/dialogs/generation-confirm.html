<dialog id="generationConfirmModal" class="generation-confirm-modal" aria-labelledby="generationConfirmTitle">
  <div class="generation-confirm-header">
    <h2 id="generationConfirmTitle">Confirm generation</h2>
    <button type="button" id="generationConfirmCloseBtn" class="secondary text-button"
      aria-label="Close generation confirmation">✕</button>
  </div>
  <div class="generation-confirm-body">
    <p id="generationConfirmIntro" class="generation-confirm-intro"></p>
    <ul id="generationConfirmBullets" class="generation-confirm-bullets"></ul>
  </div>
  <div class="generation-confirm-actions">
    <button type="button" id="generationConfirmCancelBtn" class="secondary">Cancel</button>
    <button type="button" id="generationConfirmRunBtn" class="primary">Continue</button>
  </div>
</dialog>
