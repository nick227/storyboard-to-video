<div class="sf-workbar" hidden>
  <div class="sf-workbar-inner">
    <nav class="sf-artifact-tabs page-tabs" aria-label="Work artifacts">
      <a id="tabScriptBtn" class="sf-artifact-tab page-tab" data-artifact="screenplay" data-page="script" data-panel="scriptPagePanel" href="#">Screenplay</a>
      <a id="tabStoryboardBtn" class="sf-artifact-tab page-tab" data-artifact="storyboard" data-page="storyboard" data-panel="storyboardPagePanel" href="#">Storyboard</a>
      <a id="tabTimelineBtn" class="sf-artifact-tab page-tab" data-artifact="timeline" data-page="timeline" data-panel="timelinePagePanel" href="#">Timeline</a>
    </nav>
    <div class="sf-artifact-actions">
      <label class="sf-work-visibility" title="Publish the active artifact">
        <input type="checkbox" id="workVisibilityToggle" />
        <span>Public</span>
      </label>
      <button id="workShareBtn" class="sf-action-btn" type="button" disabled>Share</button>
      <a id="downloadZipBtn" class="sf-action-btn" href="#">Download</a>
      <button id="workMoreBtn" class="sf-action-btn" type="button" hidden>More</button>
    </div>
  </div>
</div>
