<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — Storyboarder</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/screenplay-editor/screenplay-editor-standalone.css" />
  <script defer src="/js/shared/topbar.js"></script>
</head>

<body>
  <!--topbar-->
  <!--workbar-->

  <div class="app-shell">
    <header class="storyboard-topbar">
      <div class="brand-block row">
        <div class="storyboard-title-row">
          <div class="storyboard-combo">
            <button type="button" class="screenplay-logo" id="screenplayCoverBtn" aria-label="Change cover art"
              title="Change cover art">
              <img class="screenplay-logo-image" alt="" hidden />
            </button>            <input id="storyboardTitle" class="storyboard-title" type="text" maxlength="200"
              aria-label="Storyboard title" autocomplete="off" />
            <button id="storyboardPickerToggle" class="storyboard-picker-toggle" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="storyboardPickerList"
              aria-label="Open a saved storyboard" title="Open a saved storyboard">&#9662;</button>
            <ul id="storyboardPickerList" class="storyboard-picker-list" role="listbox"
              aria-label="Saved storyboards" hidden></ul>
          </div>
        </div>
        <div class="toolbar top-actions">
          <button id="newStoryboardBtn" class="primary">New</button>
          <button id="saveStateBtn" class="hidden" disabled>Saved</button>
        </div>
      </div>
    </header>

    <div class="studio-page-stage">
      <div id="pageTransition" class="page-transition" role="status" aria-live="polite" aria-atomic="true" hidden>
        <span class="page-transition-spinner" aria-hidden="true"></span>
        <span id="pageTransitionLabel">Opening page…</span>
      </div>

      <!-- Start screenplay editor -->

    <section id="scriptPagePanel" class="screenplay-editor w-full" role="tabpanel"
      aria-labelledby="tabScriptBtn" hidden>
      <article class="panel concept-column story-concept">
        <div class="script-header-row">
          <div id="screenplayToolbarHost" class="script-header-primary is-inactive" aria-hidden="true"></div>
          <div class="script-header-actions">
            <div class="script-publish-control" id="scriptPublishControl">
              <button type="button" id="scriptMetaBtn" class="script-icon-button" aria-label="Publishing details"
                title="Publishing details" aria-haspopup="dialog" aria-controls="scriptMetaModal">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M4 12h10M4 17h7" />
                  <circle cx="18" cy="12" r="2" />
                  <circle cx="15" cy="17" r="2" />
                </svg>
              </button>
              <button type="button" id="scriptShareBtn" class="script-icon-button" aria-label="Copy share link"
                title="Copy share link" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10 13a5 5 0 0 0 7.07 0l1.41-1.41a5 5 0 0 0-7.07-7.07L10 6" />
                  <path d="M14 11a5 5 0 0 0-7.07 0L5.5 12.43a5 5 0 0 0 7.07 7.07L14 18" />
                </svg>
              </button>
            </div>
            <select id="scriptModeSelect" class="script-mode-select">
              <option value="raw">Raw Text</option>
              <option value="screenplay">Screenplay Editor</option>
            </select>
            <button type="button" id="scriptFocusBtn" class="script-focus-button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
              </svg>
              <span id="scriptFocusBtnLabel">Full screen</span>
            </button>
            <div class="script-download-control">
              <button type="button" id="scriptDownloadBtn" class="script-icon-button" aria-label="Download script"
                title="Download script" aria-haspopup="menu" aria-expanded="false" aria-controls="scriptDownloadMenu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12M7 10l5 5 5-5M4 20h16" />
                </svg>
              </button>
              <div id="scriptDownloadMenu" class="script-download-menu" role="menu" aria-label="Script download format" hidden>
                <button type="button" role="menuitem" data-script-format="fountain"><strong>Fountain</strong><small>.fountain</small></button>
                <button type="button" role="menuitem" data-script-format="fdx"><strong>Final Draft XML</strong><small>.fdx</small></button>
                <button type="button" role="menuitem" data-script-format="rtf"><strong>Rich Text</strong><small>.rtf</small></button>
                <button type="button" role="menuitem" data-script-format="text"><strong>Plain Text</strong><small>.txt</small></button>
                <button type="button" role="menuitem" data-script-format="json"><strong>Structured JSON</strong><small>.json</small></button>
                <button type="button" role="menuitem" data-script-format="print"><strong>Print / PDF</strong><small>formatted pages</small></button>
              </div>
            </div>
          </div>
        </div>
        <textarea id="scriptText" class="script-textarea" rows="7"
          placeholder="Paste story or script here..."></textarea>
        <div id="screenplayEditorContainer" class="screenplay-editor-container" hidden></div>
      </article>

    </section>

      <!-- Entity screenplay editor -->

      <!-- Start storyboard -->

    <div id="storyboardPagePanel" role="tabpanel" aria-labelledby="tabStoryboardBtn">
      <input type="hidden" id="fallbackPolicy" value="local" />
      <input type="checkbox" id="enrichNarration" hidden aria-hidden="true" />

      <section class="stage-bar mb-20" aria-label="Production stages">
        <div class="stage-bar-stages">
          <button type="button" id="stagePlanningBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Planning</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <span class="stage-button-status" id="stagePlanningStatus">Not started</span>
          </button>
          <button type="button" id="stageImagesBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Images</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <span class="stage-button-status" id="stageImagesStatus">Not started</span>
          </button>
          <button type="button" id="stageAudioBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Audio</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <span class="stage-button-status" id="stageAudioStatus">Not started</span>
          </button>
          <button type="button" id="stageVideoBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Video</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <span class="stage-button-status" id="stageVideoStatus">Not started</span>
          </button>
          <button type="button" id="stageSubtitlesBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Subtitles</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <span class="stage-button-status" id="stageSubtitlesStatus">Not started</span>
          </button>
          <button type="button" id="stageTokensBtn" class="stage-button" disabled>
            <span class="stage-button-top">
              <span class="stage-button-label">Tokens</span>
              <span class="stage-button-spinner" aria-hidden="true"></span>
            </span>
            <div class="row">
              <span class="stage-button-status" id="stageTokensStatus">0.00 USD</span>
              <span id="tokensInfoBtn" class="icon-link" aria-label="View token spend details">ℹ</span>
            </div>
          </button>
        </div>

        <div class="stage-bar-actions">
          <div class="style-picker-inline">
            <select id="stageStyleSelect" class="stage-style-select" aria-label="Select Style" title="Select Style"></select>
            <button type="button" id="stageCustomStylesBtn" class="custom-styles-launch" aria-haspopup="dialog"
              aria-controls="customStylesModal">Custom styles</button>
          </div>
          <button type="button" id="settingsBtn" class="primary" aria-haspopup="dialog"
            aria-controls="settingsModal" title="Open Settings">Settings</button>
          <button type="button" id="startPauseBtn" class="primary positive">Start</button>
        </div>
      </section>

    <section id="statusPanel" class="panel panel-tight status-panel">
      <div class="row">
        <div class="status-message">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText" role="status" aria-live="polite">Idle</span>
        </div>
        <span id="generationSummaryText" class="generation-summary" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section id="runResultsPanel" class="panel panel-tight run-results-panel" hidden aria-live="polite">
      <div class="run-results-header">
        <span class="run-results-title">Last run</span>
        <button type="button" id="runResultsDismissBtn" class="secondary text-button" aria-label="Dismiss run results">✕</button>
      </div>
      <div id="runResultsRows" class="run-results-rows"></div>
    </section>

    <div class="row storyboard-add-scene-row">
      <button type="button" id="storyboardAddSceneBtn" class="add-scene-btn" aria-label="Add scene" title="Add an empty numbered scene">
        <span class="view-type-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        </span>
      </button>
    </div>

    <section class="storyboard-section" id="storyboardSection" hidden>
      <div class="storyboard-heading">
        <div class="row resize-scene-list" role="group" aria-label="Scenes per row">
          <button class="view-type" type="button" aria-label="Switch to scene slider"
            title="Edit one scene at a time" aria-pressed="false" aria-controls="storyboardGrid storyboardSlider">
            <span class="view-type-icon" aria-hidden="true">
              <svg class="view-type-icon-grid" viewBox="0 0 24 24">
                <path d="M3 3h8v8H3V3Zm10 0h8v8h-8V3ZM3 13h8v8H3v-8Zm10 0h8v8h-8v-8Z" />
              </svg>
              <svg class="view-type-icon-list" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </span>
          </button>
          <button class="resize-scenes" type="button" data-columns="3" aria-label="Show 3 scenes per row" aria-pressed="false">3</button>
          <button class="resize-scenes is-active" type="button" data-columns="6" aria-label="Show 6 scenes per row" aria-pressed="true">6</button>
        </div>
      </div>
      <div id="storyboardGrid" class="storyboard-grid" data-columns="6"></div>
      <div id="storyboardSlider" class="storyboard-slider" aria-label="Scene editor" tabindex="0" hidden>
        <div class="storyboard-slider-stage-shell">
          <button type="button" class="storyboard-slider-nav storyboard-slider-prev" aria-label="Previous scene">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="storyboard-slider-stage is-grab-stage"></div>
          <button type="button" class="storyboard-slider-nav storyboard-slider-next" aria-label="Next scene">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="storyboard-filmstrip is-grab-scroll" role="listbox" aria-label="Storyboard scenes"></div>
      </div>
    </section>

    </div>

    <!-- End storyboard -->

    <!-- Start timeline -->

    <div id="timelinePagePanel" role="tabpanel" aria-labelledby="tabTimelineBtn" hidden>
      <section class="panel timeline-section" id="timelineSection" hidden>

        <div class="timeline-stage">
          <video class="timeline-stage-video" id="timelineVideo" muted playsinline preload="auto"></video>
          <video class="timeline-stage-video" id="timelineVideoB" muted playsinline preload="auto"
            style="display:none;"></video>
          <img class="timeline-stage-image" id="timelineImage" alt="Timeline preview" />
          <div class="timeline-stage-empty" id="timelineStageEmpty">No preview yet</div>
          <div class="timeline-stage-caption subtitle-karaoke-text" id="timelineCaption" hidden></div>
          <button type="button" class="timeline-toggle" id="timelineToggle" aria-label="Play combined timeline" disabled>
            <span class="timeline-toggle-icon" aria-hidden="true">
              <svg class="timeline-icon timeline-icon-play" viewBox="0 0 24 24">
                <path d="m9 7 8 5-8 5Z" />
              </svg>
              <svg class="timeline-icon timeline-icon-pause" viewBox="0 0 24 24">
                <path d="M9 7v10M15 7v10" />
              </svg>
              <svg class="timeline-icon timeline-icon-replay" viewBox="0 0 24 24">
                <path d="M7.5 8H4V4.5" />
                <path d="M4.5 8A8 8 0 1 1 4 15" />
              </svg>
            </span>
          </button>
        </div>
        <audio id="timelineAudio" preload="auto"></audio>
        <audio id="timelineAudioB" preload="auto"></audio>

        <div class="timeline-track-wrap" id="timelineTrackWrap">
          <div class="timeline-track-inner" id="timelineTrackInner">
            <div class="timeline-thumbs" id="timelineThumbs"></div>
            <canvas class="timeline-waveform-canvas" id="timelineWaveformCanvas" height="48"></canvas>
            <div class="timeline-playhead" id="timelinePlayhead"></div>
          </div>
        </div>

      </section>
      <div class="timeline-page-empty">
        <span class="timeline-page-empty-icon" aria-hidden="true">▶</span>
        <p>Your combined timeline will appear here after the storyboard has generated media.</p>
      </div>
    </div>

    <!-- End timeline -->

    </div>

  </div>

  <template id="sceneCardTemplate">
    <article class="scene-card">
      <div class="scene-header">
        <div class="scene-heading">
          <div class="scene-index"></div>
          <h3 class="scene-title"></h3>
        </div>
        <button type="button" class="scene-manage-btn" aria-label="Scene controls">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M11 16v4" />
          </svg>
          <span class="status-icon-spinner" aria-hidden="true"></span>
          <span class="scene-manage-summary"></span>
        </button>
      </div>

      <div class="scene-image-wrap">
        <img class="scene-image" alt="Scene preview" draggable="false" />
        <video class="scene-video scene-image" muted playsinline preload="metadata"
          aria-label="Animated scene preview"></video>
        <div class="scene-placeholder">No image yet</div>
        <button type="button" class="scene-media-toggle" aria-label="Play scene" hidden>
          <span class="scene-media-toggle-icon" aria-hidden="true">
            <svg class="scene-media-icon scene-media-icon-play" viewBox="0 0 24 24">
              <path d="m9 7 8 5-8 5Z" />
            </svg>
            <svg class="scene-media-icon scene-media-icon-pause" viewBox="0 0 24 24">
              <path d="M9 7v10M15 7v10" />
            </svg>
            <svg class="scene-media-icon scene-media-icon-replay" viewBox="0 0 24 24">
              <path d="M7.5 8H4V4.5" />
              <path d="M4.5 8A8 8 0 1 1 4 15" />
            </svg>
          </span>
        </button>
        <div class="image-loading target-loading" role="status"><span class="spinner"></span><span>Generating
            image</span></div>
        <div class="video-loading target-loading" role="status"><span class="spinner"></span><span>Generating
            video</span></div>
        <div class="audio-loading target-loading" role="status"><span class="spinner"></span><span>Generating
            audio</span></div>
        <audio class="scene-audio" preload="metadata"></audio>
        <div class="scene-caption subtitle-karaoke-text" hidden></div>
      </div>
    </article>
  </template>

  <!--dialogs/add-scene-->

  <!--dialogs/entity-->

  <!--dialogs/settings-->

  <!--dialogs/custom-styles-->

  <!--dialogs/style-ref-lightbox-->

  <!--dialogs/script-meta-->

  <!--dialogs/scene-references-->

  <!--dialogs/generation-confirm-->

  <!--dialogs/download-confirm-->

  <!--dialogs/start-run-->

  <!--dialogs/voice-library-->

  <!--dialogs/confirm-regen-->

  <!--dialogs/image-library-->

  <!--dialogs/tokens-info-->

  <script type="module" src="/js/app.js"></script>
</body>

</html>
